<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBase v3.6 - Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --solar-dark: #0f172a; --solar-darker: #0b1120; --solar-gold: #fbbf24; --bg-body: #f1f5f9; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --neon-green: #39ff14; --border: #e2e8f0; --grad-primary: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05); --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.08); --free-color: #39ff14; --sold-normal: #64748b; --sold-warning: #f59e0b; --sold-expired: #ef4444; --sidebar-width: 260px; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-body); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar-pro { width: var(--sidebar-width); background: var(--solar-darker); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
        .sidebar-brand { background: var(--grad-primary); color: var(--neon-green); padding: 24px 20px; text-align: center; font-weight: 800; font-size: 16px; border-bottom: 2px solid var(--neon-green); }
        .sidebar-nav { padding: 20px 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
        .tab-btn { background: transparent; border: none; color: #94a3b8; font-size: 14px; font-weight: 600; cursor: pointer; padding: 14px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; text-align: left; }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: white; }
        .tab-btn.active { background: rgba(57, 255, 20, 0.1); color: var(--neon-green); border-left: 4px solid var(--neon-green); }
        .main-workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .content-area { flex: 1; padding: 30px; overflow-y: auto; }
        .btn-save { background: var(--grad-primary); color: var(--neon-green); width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--neon-green); font-weight: 800; cursor: pointer; }
        .tab-content { display: none; } .active-tab { display: block; }
    </style>
</head>
<body>

<aside class="sidebar-pro">
    <div class="sidebar-brand">STREAMBASE PRO</div>
    <nav class="sidebar-nav">
        <button class="tab-btn active" onclick="verTab('tab-home', this)"><span>🏠</span> Inicio</button>
        <button class="tab-btn" onclick="verTab('tab-inventory', this)"><span>📦</span> Stock</button>
        <button class="tab-btn" onclick="verTab('tab-list', this)"><span>👥</span> Clientes</button>
        <button class="tab-btn" onclick="verTab('tab-perfiles-tv', this)"><span>📺</span> Cuentas</button>
        <button class="tab-btn" onclick="verTab('tab-despacho-tv', this)"><span>🚀</span> Despacho</button>
    </nav>
</aside>

<main class="main-workspace">
    <header class="top-header">
        <h2>Panel de Administración</h2>
        <div style="display:flex; gap:10px;">
            <button class="btn-save" style="background:#3b82f6; border:none; color:white; padding:10px;" onclick="guardarEnNube()">⬆️ Sync Firebase</button>
            <button class="btn-save" style="background:#10b981; border:none; color:white; padding:10px;" onclick="cargarDeNube()">⬇️ Descargar Nube</button>
            <button class="btn-save" style="background:transparent; border:1px solid #3b82f6; color:#3b82f6; padding:10px;" onclick="abrirConfigNube()">⚙️ API</button>
        </div>
    </header>
    <div class="content-area">
        <div id="tab-home" class="tab-content active-tab">...Contenido...</div>
    </div>
</main>

<script>
    // ... Tu lógica original ...

    // FUNCIONES DE SINCRONIZACIÓN INTEGRADAS
    async function guardarEnNube() {
        const dbUrl = localStorage.getItem('cloud_firebase_url');
        if(!dbUrl) return alert("❌ Configura la API Nube primero.");

        const payload = { db: clientes, stock: stock, tv_db: inv_tv, tv_cli: cli_tv, ultima_vez: new Date().toLocaleString() };
        
        try {
            const response = await fetch(dbUrl + "streambase.json", {
                method: 'PUT',
                body: JSON.stringify(payload)
            });
            
            if(response.ok) {
                alert("✅ Datos sincronizados correctamente.");
            } else {
                alert("❌ Error: Firebase rechazó la conexión. Revisa tus reglas (Rules).");
            }
        } catch(e) {
            alert("❌ Error crítico de red. Verifica tu URL de Firebase.");
        }
    }

    async function cargarDeNube() {
        const dbUrl = localStorage.getItem('cloud_firebase_url');
        if(!dbUrl) return alert("❌ Configura la API Nube primero.");

        try {
            const response = await fetch(dbUrl + "streambase.json");
            
            if(response.ok) {
                const data = await response.json();
                if(!data) return alert("❌ La base en la nube está vacía.");

                clientes = data.db || []; 
                stock = data.stock || []; 
                inv_tv = data.tv_db || []; 
                cli_tv = data.tv_cli || []; 
                
                localStorage.setItem('solar_db', JSON.stringify(clientes)); 
                localStorage.setItem('solar_stock', JSON.stringify(stock)); 
                localStorage.setItem('tvnicaplay_db', JSON.stringify(inv_tv)); 
                localStorage.setItem('tvnicaplay_clientes', JSON.stringify(cli_tv)); 
                
                alert("✅ Datos restaurados exitosamente.");
                location.reload(); 
            } else {
                alert("❌ Error: No se pudo obtener la base de datos.");
            }
        } catch(e) {
            alert("❌ Error al conectar con la nube.");
        }
    }

    function abrirConfigNube() {
        let dbUrl = prompt("Pega la URL de Firebase:", localStorage.getItem('cloud_firebase_url') || "");
        if (dbUrl) localStorage.setItem('cloud_firebase_url', dbUrl.endsWith('/') ? dbUrl : dbUrl + '/');
    }
</script>
</body>
</html>
