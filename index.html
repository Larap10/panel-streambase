<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase Enterprise | Control Maestro</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #FFD700; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #000; height: 100vh; padding: 25px; border-right: 1px solid #222; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .section { display: none; }
        .module-title { color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .client-card { background: #161616; border-radius: 12px; padding: 15px; border: 1px solid #222; }
        .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--accent)">STREAMBASE PRO</h2>
        <div onclick="show('dashboard')" style="cursor:pointer; padding:15px;">📊 Dashboard Ejecutivo</div>
        <div onclick="show('clients')" style="cursor:pointer; padding:15px;">👥 Gestión por Servicios</div>
    </div>

    <div class="main">
        <div id="dashboard" class="section" style="display:block;">
            <h1>Alertas Críticas</h1>
            <div id="alert-box"></div>
            <div id="dashboard-content"></div>
        </div>
        <div id="clients" class="section">
            <div id="service-grouping"></div>
        </div>
    </div>

    <script>
        let state = { db: [], url: localStorage.getItem('s_url') || '' };

        async function sync() {
            let res = await fetch(state.url + 'streambase.json');
            let data = await res.json();
            state.db = data.db || [];
            render();
        }

        function render() {
            // 1. Dashboard: Alertas
            let alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = '';
            state.db.forEach(c => {
                let diff = (new Date(c.vence) - new Date()) / (1000 * 60 * 60 * 24);
                if(diff < 3) alertBox.innerHTML += `<div style="background:#220000; padding:10px; margin:5px 0;">⚠️ ${c.nombre} (${c.servicio}) vence en ${Math.round(diff)} días.</div>`;
            });

            // 2. Clientes Agrupados por Servicio
            let container = document.getElementById('service-grouping');
            container.innerHTML = '';
            let services = [...new Set(state.db.map(c => c.servicio))];
            
            services.forEach(serv => {
                container.innerHTML += `<h2 class="module-title">${serv.toUpperCase()}</h2>`;
                let grid = document.createElement('div');
                grid.className = 'grid-cards';
                state.db.filter(c => c.servicio === serv).forEach(c => {
                    grid.innerHTML += `
                        <div class="client-card">
                            <b>${c.nombre}</b><br>
                            <small style="color:#888">Pass: ${c.clave}</small><br>
                            <span class="status-badge" style="background:#333">${c.vence}</span>
                        </div>`;
                });
                container.appendChild(grid);
            });
        }
        
        function show(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
        
        if(state.url) sync();
    </script>
</body>
</html>
