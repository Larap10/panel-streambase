<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase Enterprise | Panel Maestro</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #FFD700; --text: #E6EDF3; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 260px; background: #000; height: 100vh; padding: 25px; border-right: 1px solid #222; }
        .nav { padding: 15px; margin: 5px 0; border-radius: 12px; cursor: pointer; color: #888; font-weight: 600; }
        .nav:hover { background: #1a1a1a; color: var(--accent); }
        .main { flex: 1; padding: 40px; }
        .section { display: none; }
        .card { background: var(--panel); border: 1px solid #333; padding: 25px; border-radius: 16px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--accent)">STREAMBASE PRO</h2>
        <div class="nav" onclick="show('dashboard')">📊 Resumen Ejecutivo</div>
        <div class="nav" onclick="show('clients')">👥 Gestión Clientes</div>
        <div class="nav" onclick="show('accounts')">🍿 Control Cuentas</div>
        <div class="nav" onclick="show('config')">⚙️ Ajustes Nube</div>
    </div>

    <div class="main">
        <div id="dashboard" class="section" style="display:block;">
            <h1>Panel Ejecutivo</h1>
            <div id="d-content" class="card">Conecta el sistema en "Ajustes Nube" para visualizar tus datos.</div>
        </div>
        <div id="clients" class="section"><h1>Gestión Clientes</h1></div>
        <div id="accounts" class="section"><h1>Control Cuentas</h1></div>
        <div id="config" class="section">
            <h1>Ajustes Nube</h1>
            <input type="text" id="url-in" placeholder="https://tu-proyecto.firebaseio.com/" style="width:100%; padding:15px; background:#111; color:#fff;">
            <button onclick="save()" style="margin-top:15px; padding:15px; width:100%; background:var(--accent); cursor:pointer;">GUARDAR Y SINCRONIZAR</button>
        </div>
    </div>

    <script>
        let state = { db: [], tv_db: [], url: localStorage.getItem('s_url') || '' };
        
        async function save() {
            let url = document.getElementById('url-in').value.trim();
            if(!url.endsWith('/')) url += '/';
            localStorage.setItem('s_url', url);
            state.url = url;
            sync();
        }

        async function sync() {
            try {
                let res = await fetch(state.url + 'streambase.json');
                if(!res.ok) throw new Error("401 Unauthorized");
                let data = await res.json();
                state.db = data.db || [];
                state.tv_db = data.tv_db || [];
                document.getElementById('d-content').innerText = "Clientes: " + state.db.length + " | Cuentas: " + state.tv_db.length;
            } catch(e) { document.getElementById('d-content').innerText = "Error: " + e.message; }
        }

        function show(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        if(state.url) { document.getElementById('url-in').value = state.url; sync(); }
    </script>
</body>
</html>
