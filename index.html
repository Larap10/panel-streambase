<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase PRO - Sincronización Final</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #0f172a; color: white; display: flex; flex-direction: column; }
        .nav-btn { padding: 20px; color: #94a3b8; cursor: pointer; border: none; background: none; font-weight: bold; text-align: left; }
        .nav-btn.active { color: #39ff14; background: #1e293b; border-left: 4px solid #39ff14; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .tab { display: none; } .active-tab { display: block; }
        .btn-action { padding: 10px 15px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div style="padding: 20px; font-weight: 800; color: #39ff14;">STREAMBASE PRO</div>
    <button class="nav-btn active" onclick="verTab('tab-home', this)">Inicio</button>
    <button class="nav-btn" onclick="verTab('tab-inventory', this)">Stock</button>
</aside>

<main class="main">
    <div style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display:flex; gap:10px; align-items:center;">
        <input type="text" id="url-input" placeholder="https://tu-proyecto.firebaseio.com/" style="padding: 8px; width: 300px;">
        <button class="btn-action" onclick="guardarURL()">💾 Guardar URL</button>
        <button class="btn-action" style="background:#3b82f6; color:white;" onclick="guardarEnNube()">⬆️ Sync Nube</button>
        <button class="btn-action" style="background:#10b981; color:white;" onclick="cargarDeNube()">⬇️ Descargar</button>
    </div>

    <div id="tab-home" class="tab-content active-tab">Dashboard cargado.</div>
    <div id="tab-inventory" class="tab-content">Contenido Stock.</div>
</main>

<script>
    // Recuperar URL al cargar
    window.onload = () => {
        const saved = localStorage.getItem('db_url');
        if(saved) document.getElementById('url-input').value = saved;
    };

    function guardarURL() {
        let url = document.getElementById('url-input').value.trim();
        if(!url.startsWith('https://')) return alert("La URL debe empezar con https://");
        url = url.endsWith('/') ? url : url + '/';
        localStorage.setItem('db_url', url);
        alert("✅ URL guardada.");
    }

    async function guardarEnNube() {
        const url = localStorage.getItem('db_url');
        if(!url) return alert("Guarda la URL primero.");
        
        try {
            const data = { 
                db: JSON.parse(localStorage.getItem('solar_db') || '[]'),
                stock: JSON.parse(localStorage.getItem('solar_stock') || '[]')
            };
            const res = await fetch(url + "streambase.json", {
                method: 'PUT',
                body: JSON.stringify(data)
            });
            if(res.ok) alert("✅ Sincronizado correctamente.");
            else alert("❌ Error Firebase: Verifica tus Reglas (deben estar en true).");
        } catch(e) { alert("❌ Error de red. Verifica la URL."); }
    }

    async function cargarDeNube() {
        const url = localStorage.getItem('db_url');
        if(!url) return alert("Guarda la URL primero.");
        
        try {
            const res = await fetch(url + "streambase.json?t=" + Date.now());
            if(res.ok) {
                const data = await res.json();
                if(data) {
                    localStorage.setItem('solar_db', JSON.stringify(data.db || []));
                    localStorage.setItem('solar_stock', JSON.stringify(data.stock || []));
                    alert("✅ Descargado. Recargando página...");
                    location.reload();
                } else alert("❌ La base de datos en la nube está vacía.");
            } else alert("❌ Error al conectar: " + res.status);
        } catch(e) { alert("❌ Error de red."); }
    }

    function verTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active-tab');
        btn.classList.add('active');
    }
</script>
</body>
</html>
