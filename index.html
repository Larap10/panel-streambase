<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase PRO</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #0f172a; color: white; display: flex; flex-direction: column; }
        .btn-nav { color: #94a3b8; padding: 20px; cursor: pointer; border: none; background: none; text-align: left; font-weight: bold; }
        .btn-nav.active { color: #39ff14; border-left: 4px solid #39ff14; background: #1e293b; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .tab-content { display: none; }
        .active-tab { display: block; }
        button.action { padding: 10px 20px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div style="padding: 20px; font-weight: 800; color: #39ff14;">STREAMBASE PRO</div>
    <button class="btn-nav active" onclick="mostrarTab('tab-home', this)">Inicio</button>
    <button class="btn-nav" onclick="mostrarTab('tab-inventory', this)">Stock</button>
    <button class="btn-nav" onclick="mostrarTab('tab-list', this)">Clientes</button>
</aside>

<main class="main">
    <div style="margin-bottom: 20px;">
        <button class="action" style="background:#3b82f6; color:white;" onclick="guardarEnNube()">Sync Nube</button>
        <button class="action" style="background:#10b981; color:white;" onclick="cargarDeNube()">Descargar</button>
        <button class="action" onclick="abrirConfig()">⚙️ API</button>
    </div>

    <div id="tab-home" class="tab-content active-tab">
        <div id="dashboard-data">Cargando...</div>
    </div>
    <div id="tab-inventory" class="tab-content">Contenido Stock</div>
    <div id="tab-list" class="tab-content">Contenido Clientes</div>
</main>

<script>
    // 1. Lógica de Navegación
    function mostrarTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active-tab');
        btn.classList.add('active');
    }

    // 2. Lógica Firebase (Sin dependencias externas)
    function abrirConfig() {
        let url = prompt("Pega tu URL de Firebase (ej: https://proyecto.firebaseio.com/):");
        if(url) localStorage.setItem('cloud_url', url.endsWith('/') ? url : url + '/');
    }

    async function guardarEnNube() {
        const url = localStorage.getItem('cloud_url');
        if(!url) return alert("Configura la API primero.");
        try {
            const res = await fetch(url + "data.json", {
                method: 'PUT',
                body: JSON.stringify({ 
                    db: JSON.parse(localStorage.getItem('solar_db') || '[]'),
                    stock: JSON.parse(localStorage.getItem('solar_stock') || '[]')
                })
            });
            alert(res.ok ? "✅ Sincronizado" : "❌ Error Firebase");
        } catch(e) { alert("❌ Error de red"); }
    }

    async function cargarDeNube() {
        const url = localStorage.getItem('cloud_url');
        if(!url) return alert("Configura la API primero.");
        try {
            const res = await fetch(url + "data.json?t=" + Date.now());
            const data = await res.json();
            if(data) {
                localStorage.setItem('solar_db', JSON.stringify(data.db || []));
                localStorage.setItem('solar_stock', JSON.stringify(data.stock || []));
                alert("✅ Datos recibidos. Recargando...");
                location.reload();
            }
        } catch(e) { alert("❌ Error al descargar"); }
    }

    // 3. Inicialización
    window.onload = () => {
        document.getElementById('dashboard-data').innerText = "Sistema Listo. Presiona 'Descargar' para cargar tus datos.";
    };
</script>
</body>
</html>
