<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase Enterprise Pro</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #FFD700; --netflix: #E50914; --disney: #113CCF; --max: #A020F0; }
        body { margin: 0; font-family: 'Inter', system-ui; background: var(--bg); color: #fff; display: flex; }
        .sidebar { width: 260px; background: #000; height: 100vh; padding: 25px; border-right: 1px solid #222; }
        .nav { padding: 15px; margin: 5px 0; border-radius: 12px; cursor: pointer; color: #888; font-weight: 600; }
        .nav:hover { background: #1a1a1a; color: var(--accent); }
        .main { flex: 1; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--panel); border: 1px solid #333; padding: 25px; border-radius: 16px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--accent)">STREAMBASE PRO</h2>
        <div class="nav" onclick="show('dashboard')">📊 Resumen Ejecutivo</div>
        <div class="nav" onclick="show('clients')">👥 Gestión Clientes</div>
        <div class="nav" onclick="show('accounts')">🍿 Control Cuentas</div>
        <div class="nav" onclick="show('config')">⚙️ Ajustes Nube</div>
        <div style="margin-top:auto; font-size:12px;"><span id="status" class="status-dot"></span><span id="stat-text">Desconectado</span></div>
    </div>

    <div class="main">
        <div id="dashboard" class="section">
            <h1>Panel Ejecutivo</h1>
            <div class="grid">
                <div class="card"><h3>CLIENTES</h3><h2 id="d-clients">0</h2></div>
                <div class="card"><h3>PLATAFORMAS</h3><h2 id="d-accs">0</h2></div>
                <div class="card"><h3>INGRESOS</h3><h2 id="d-in">$0.00</h2></div>
                <div class="card"><h3>EGRESOS</h3><h2 id="d-out">$0.00</h2></div>
            </div>
        </div>
        <div id="config" class="section">
            <h1>Conexión con la Nube</h1>
            <input type="text" id="url-input" style="width:100%; padding:15px; background:#111; color:#fff; border:1px solid #333;">
            <button onclick="saveConn()" style="margin-top:15px; padding:15px; width:100%; background:var(--accent); cursor:pointer;">GUARDAR Y SINCRONIZAR</button>
        </div>
    </div>

    <script>
        let state = { db: [], tv_db: [], url: localStorage.getItem('s_url') || '' };
        
        async function saveConn() {
            let url = document.getElementById('url-input').value.trim();
            if(!url.endsWith('/')) url += '/';
            localStorage.setItem('s_url', url);
            state.url = url;
            sync();
        }

        async function sync() {
            document.getElementById('stat-text').innerText = "Sincronizando...";
            try {
                let res = await fetch(state.url + 'streambase.json');
                if(!res.ok) throw new Error("401 Unauthorized - Revisa Reglas Firebase");
                let data = await res.json();
                state.db = data.db || [];
                state.tv_db = data.tv_db || [];
                document.getElementById('d-clients').innerText = state.db.length;
                document.getElementById('d-accs').innerText = state.tv_db.length;
                document.getElementById('status').style.background = "#10B981";
                document.getElementById('stat-text').innerText = "Conectado";
            } catch(e) { 
                document.getElementById('stat-text').innerText = "Error: " + e.message;
                document.getElementById('status').style.background = "#EF4444";
            }
        }
        
        function show(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        if(state.url) { document.getElementById('url-input').value = state.url; sync(); }
    </script>
</body>
</html>
