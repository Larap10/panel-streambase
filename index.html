<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase Enterprise Control</title>
    <style>
        :root { --bg: #050505; --panel: #111111; --accent: #FFD700; --text: #E6EDF3; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #000; height: 100vh; padding: 20px; border-right: 1px solid #222; }
        .nav-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: #888; font-weight: bold; }
        .nav-item:hover { background: #111; color: var(--accent); }
        .main { flex: 1; padding: 30px; }
        .section { display: none; }
        .card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--accent)">STREAMBASE PRO</h2>
        <div class="nav-item" onclick="showSection('dashboard')">📊 Resumen General</div>
        <div class="nav-item" onclick="showSection('config')">⚙️ Ajustes Nube</div>
    </div>
    <div class="main">
        <div id="dashboard" class="section" style="display:block;">
            <h1>Resumen General</h1>
            <div id="d-content" class="card">Cargando datos de la nube...</div>
        </div>
        <div id="config" class="section">
            <h1>Configurar Conexión</h1>
            <input type="text" id="fb-url" placeholder="https://tu-proyecto.firebaseio.com/" style="width:100%; padding:10px; background:#111; color:#fff;">
            <button onclick="saveAndSync()" style="margin-top:10px; padding:10px;">Guardar y Conectar</button>
        </div>
    </div>

    <script>
        let state = { db: [], tv_db: [], cash: [], url: localStorage.getItem('streambase_url') || '' };

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        async function saveAndSync() {
            state.url = document.getElementById('fb-url').value.trim();
            if(!state.url.endsWith('/')) state.url += '/';
            localStorage.setItem('streambase_url', state.url);
            await sync();
        }

        async function sync() {
            try {
                let res = await fetch(state.url + 'streambase.json');
                let data = await res.json();
                state.db = data.db || [];
                state.tv_db = data.tv_db || [];
                document.getElementById('d-content').innerText = "Clientes cargados: " + state.db.length;
            } catch(e) { document.getElementById('d-content').innerText = "Error de conexión. Revisa la URL."; }
        }

        // Ejecutar al iniciar
        if(state.url) sync();
    </script>
</body>
</html>
