<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBase v3.6 - Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --primary: #38bdf8; 
            --accent: #fbbf24; --text: #f1f5f9; --text-dim: #94a3b8;
            --neon-green: #39ff14; --danger: #ef4444; --success: #22c55e;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 100px; }
        
        /* Dashboard Layout */
        .navbar { background: var(--surface); padding: 1.5rem; text-align: center; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .tab-content { display: none; } .active-tab { display: block; }

        /* Componentes Estilo Dashboard */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-item { background: var(--surface); padding: 15px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-item b { display: block; font-size: 1.5rem; color: var(--primary); }
        
        .master-card, .service-tile { background: var(--surface); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        
        input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 10px; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: var(--bg); border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }

        /* Floating Navigation */
        .tab-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(15px); height: 65px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 1000; border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn span { font-size: 10px; margin-top: 2px; }

        .neon-text { color: var(--neon-green); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { background: var(--surface); padding: 25px; border-radius: 24px; width: 90%; max-width: 400px; }
    </style>
</head>
