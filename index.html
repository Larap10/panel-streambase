<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBase v3.6 - Pro Edition & Gestión Perfiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --solar-dark: #0f172a;
            --solar-gold: #fbbf24;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --neon-green: #39ff14;
            --border: #e2e8f0;
            --grad-primary: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.08);
            
            /* Colores para el sistema de perfiles */
            --free-color: #39ff14;
            --sold-normal: #64748b; 
            --sold-warning: #f59e0b; 
            --sold-expired: #ef4444; 
        }

        .neon-text {
            color: var(--neon-green) !important;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-body); margin: 0; padding-bottom: 110px; color: var(--text-main); line-height: 1.5; }
        .navbar { background: var(--grad-primary); color: var(--neon-green); padding: 20px; text-align: center; font-weight: 800; border-bottom: 2px solid var(--neon-green); position: sticky; top: 0; z-index: 1000; font-size: 16px; letter-spacing: 2px; text-shadow: 1px 1px 2px #000; }
        .container { padding: 20px; max-width: 550px; margin: auto; }
        .tab-content { display: none; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .active-tab { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .stock-card { border-radius: 24px; padding: 22px; margin-bottom: 18px; transition: all 0.3s ease; box-shadow: var(--shadow-sm); border: none; }
        .stock-available { background: linear-gradient(135deg, #000000 0%, #7f1d1d 100%); color: white; }
        .stock-full { background: linear-gradient(135deg, #0284c7 0%, #450a0a 100%); color: white; }
        
        .usuarios-lista { background: rgba(255,255,255,0.15); border-radius: 16px; padding: 14px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        .user-tag { background: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; color: #000; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 24px; }
        .stat-item { background: var(--card-bg); padding: 18px; border-radius: 24px; text-align: center; border: 1px solid var(--border); }
        .stat-item b { display: block; font-size: 26px; margin-top: 4px; font-weight: 800; }
        .finance-card { background: var(--grad-primary); border-radius: 28px; padding: 25px; color: white; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .fin-box { border-left: 2px solid var(--neon-green); padding-left: 18px; }
        .service-tile { background: #fff; border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .master-card { background: white; border-radius: 28px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        input, select { width: 100%; padding: 14px 18px; border-radius: 16px; border: 1.5px solid #f1f5f9; background: #f8fafc; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif;}
        .btn-save { background: var(--grad-primary); color: var(--neon-green); width: 100%; padding: 16px; border-radius: 18px; border: 1px solid var(--neon-green); font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { opacity: 0.9; }

        .tab-bar { position: fixed; bottom: 20px; left: 10px; right: 10px; background: rgba(15, 23, 42, 0.95); height: 70px; border-radius: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 2000; border: 1px solid rgba(57, 255, 20, 0.2); }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 9px; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 5px; flex: 1; font-family: 'Plus Jakarta Sans', sans-serif;}
        .tab-btn span { font-size: 18px; margin-bottom: 3px; }
        .tab-btn.active { color: var(--neon-green); font-weight: 800; }
        
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .bg-vencido { background: #fee2e2; color: #ef4444; }
        .bg-alerta { background: #ffedd5; color: #f59e0b; }
        .bg-activo { background: #dcfce7; color: #22c55e; }
        .bg-prov { background: #e0e7ff; color: #4338ca; }
        .v-label { font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 8px; display: inline-flex; align-items: center; margin-right: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .dot-free { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
        .dot-busy { background: #94a3b8; }

        /* Estilos Integrados para Perfiles y Despacho */
        .account-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #4b5563; margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
        .account-actions button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 5px; opacity: 0.7; }
        .account-actions button:hover { opacity: 1; transform: scale(1.1); }
        .profiles-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .profile-badge { padding: 6px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 68px; transition: opacity 0.2s; border: 1px solid rgba(0,0,0,0.1); }
        .profile-badge:hover { opacity: 0.8; }
        .profile-free { background-color: var(--free-color); color: #000; box-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;}
        .form-group label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 800; color: #4b5563; }
        .btn-whatsapp { background-color: #25D366; border-color: #25D366; color: white; }
        
        /* Modal Styles para edición de perfiles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { background: white; padding: 25px; border-radius: 28px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

<div id="modal-perfil-tv" class="modal-overlay">
    <div class="modal-content">
        <h3 class="neon-text" style="margin-top:0; margin-bottom: 20px; font-size: 18px; font-weight: 800; color: var(--solar-dark) !important; text-shadow: none;">⚙️ Gestión de Perfil</h3>
        <input type="hidden" id="modal_acc_id_tv">
        <input type="hidden" id="modal_p_index_tv">
        <input type="hidden" id="modal_plat_name_tv">
        <input type="hidden" id="modal_usr_tv">
        <input type="hidden" id="modal_pwd_tv">
        
        <div class="grid-2">
            <div class="form-group"><label>Nombre Perfil</label><input type="text" id="m_nombre_tv"></div>
            <div class="form-group"><label>PIN</label><input type="text" id="m_pin_tv"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label>WhatsApp Cliente</label><input type="number" id="m_wa_tv"></div>
            <div class="form-group"><label>Nombre Cliente</label><input type="text" id="m_cliente_tv"></div>
        </div>
        <div class="form-group">
            <label>Fecha de Vencimiento Actual</label>
            <input type="date" id="m_vence_tv">
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; margin-top: 20px;">
            <button class="btn-save" style="background:#10b981; border:none; color:white; padding:12px;" onclick="guardarEdicionPerfilTV()">💾 Guardar Cambios</button>
            <button class="btn-save" style="background:#25D366; border:none; color:white; padding:12px;" onclick="renovarPerfilTV()">🔄 Renovar 1 Mes y Avisar</button>
            <button class="btn-save" style="background:#ef4444; border:none; color:white; padding:12px;" onclick="modalLiberarPerfilTV()">🗑️ Liberar Perfil</button>
            <button class="btn-save" style="background:#f1f5f9; color:#475569; border:none; padding:12px;" onclick="cerrarModalTV()">❌ Cancelar</button>
        </div>
    </div>
</div>

<div class="navbar neon-text">STREAMBASE V3.6 PRO</div>

<div class="container">
    <div id="tab-home" class="tab-content active-tab">
        <div class="stats-grid">
            <div class="stat-item"><small>Clientes</small><b class="neon-text"><span id="st-total">0</span></b></div>
            <div class="stat-item"><small>Alerta</small><b class="neon-text" style="filter: hue-rotate(300deg);"><span id="st-warn">0</span></b></div>
            <div class="stat-item"><small>Vencidos</small><b class="neon-text" style="filter: hue-rotate(320deg);"><span id="st-ven">0</span></b></div>
        </div>
        <div class="finance-card">
            <div class="fin-box"><small>Inversión Total</small><b id="total-inversion" class="neon-text">$ 0.00</b></div>
            <div class="fin-box"><small>Utilidad Estimada</small><b id="total-ganancia" class="neon-text">$ 0.00</b></div>
        </div>
        
        <div style="background: #eff6ff; border-radius: 24px; padding: 20px; margin-top: 25px; border: 2px dashed #3b82f6; text-align: center;">
            <h4 style="margin: 0 0 15px 0; color: #1e3a8a;">☁️ Sincronización en la Nube</h4>
            <button class="btn-save" style="background: #3b82f6; border: none; color: white; margin-bottom: 10px;" onclick="guardarEnNube()">⬆️ SUBIR A LA NUBE (SYNC)</button>
            <button class="btn-save" style="background: #10b981; border: none; color: white; margin-bottom: 10px;" onclick="cargarDeNube()">⬇️ DESCARGAR DE LA NUBE</button>
            <button class="btn-save" style="background: transparent; border: 1px solid #3b82f6; color: #3b82f6; padding: 10px;" onclick="abrirConfigNube()">⚙️ Configurar API Nube</button>
        </div>

        <div style="background: #f1f5f9; border-radius: 24px; padding: 20px; margin-top: 15px; border: 2px dashed var(--solar-dark); text-align: center;">
            <button class="btn-save" style="background: white; border: 1px solid var(--border); margin-bottom: 10px; color: var(--solar-dark);" onclick="descargarBackup()">📥 DESCARGAR RESPALDO LOCAL</button>
            <button class="btn-save neon-text" style="border:none;" onclick="restaurarBackup()">🔄 RESTAURAR BASE LOCAL</button>
        </div>
    </div>

    <div id="tab-inventory" class="tab-content">
        <div class="master-card">
            <h3 class="neon-text" style="margin:0 0 20px 0; font-size:18px; font-weight:800;">📥 Gestión de Stock</h3>
            <input type="hidden" id="inv-edit-id">
            <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:12px; margin-bottom:12px;">
                <div class="form-group"><label>Servicio</label>
                    <select id="inv-servicio" onchange="autoConfigurarCupos()">
                        <option value="">Seleccionar...</option>
                        <option value="Netflix Extra">Netflix Extra</option>
                        <option value="Disney+">Disney+</option>
                        <option value="HBO Max">HBO Max</option>
                        <option value="Prime Video">Prime Video</option>
                        <option value="Paramount+">Paramount+</option>
                        <option value="Spotify Individual">Spotify Individual</option>
                        <option value="YouTube Individual">YouTube Individual</option>
                        <option value="Stella TV">Stella TV</option>
                        <option value="FlujoTV">FlujoTV</option>
                        <option value="IPTV">IPTV</option>
                        <option value="Crunchyroll">Crunchyroll</option>
                        <option value="Vix Premium">Vix Premium</option>
                        <option value="Canva Edu">Canva Edu</option>
                        <option value="Tele Latino">Tele Latino</option> </select>
                </div>
                <div class="form-group"><label>Plan</label><select id="inv-plan"><option value="Standard">Standard</option><option value="Premium">Premium</option></select></div>
            </div>
            <div class="form-group" style="margin-bottom:12px;"><label>Correo</label><input type="text" id="inv-correo"></div>
            <div class="form-group" style="margin-bottom:12px;"><label>Contraseña</label><input type="text" id="inv-clave"></div>
            <div class="form-group" style="margin-bottom:12px;"><label>Capacidad</label><input type="number" id="inv-max"></div>
            <button class="btn-save neon-text" id="btn-save-stock" onclick="agregarAlStock()">GUARDAR EN STOCK</button>
            <button class="btn-save" id="btn-cancel-stock" style="display:none; background:#f1f5f9; color:#475569; margin-top:12px; border:none;" onclick="limpiarFormStock()">CANCELAR</button>
        </div>
        <div id="lista-inventario"></div>
    </div>

    <div id="tab-list" class="tab-content">
        <input type="text" id="busqueda" placeholder="🔍 Buscar cliente, servicio o correo..." onkeyup="renderizarLista()" style="margin-bottom:20px;">
        <div id="sec-activos"></div>
    </div>

    <div id="tab-alerts" class="tab-content">
        <div id="sec-vencidos"></div>
        <div id="sec-alerta"></div>
    </div>

    <div id="tab-add" class="tab-content">
        <div class="master-card">
            <h3 id="form-title" class="neon-text" style="margin:0 0 25px 0; font-size:18px; font-weight:800;">🚀 Registrar Venta</h3>
            <input type="hidden" id="edit-id">
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom: 12px;">
                <div class="form-group">
                    <label>Filtrar Plataforma</label>
                    <select id="f-filtro-servicio" onchange="filtrarCuentasPorServicio(true)"></select>
                </div>
                <div class="form-group">
                    <label>Cuenta Disponible</label>
                    <select id="f-auto-cuenta" onchange="seleccionarCuentaAuto()"></select>
                </div>
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>Cliente</label>
                <input type="text" id="f-nombre" list="clientes-sugeridos" oninput="detectarClienteExistente(this.value)" placeholder="Nombre del cliente..." autocomplete="off">
                <datalist id="clientes-sugeridos"></datalist>
            </div>
            <div class="form-group" style="margin-bottom:12px;"><label>WhatsApp</label><input type="number" id="f-celular"></div>
            <div class="form-group" style="margin-bottom:12px;"><label>Servicio</label><input type="text" id="f-servicio"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
                <div class="form-group"><label>Vence Cliente</label><input type="date" id="f-vence"></div>
                <div class="form-group"><label>PIN</label><input type="text" id="f-pin" value="1234"></div>
            </div>
            <div class="form-group" style="margin-bottom:12px;"><label>Correo</label><input type="text" id="f-correo"></div>
            <div class="form-group" style="margin-bottom:12px;"><label>Password</label><input type="text" id="f-clave"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
                <div class="form-group"><label>Proveedor</label><input type="text" id="f-proveedor"></div>
                <div class="form-group"><label>Vence Proveedor</label><input type="date" id="f-vence-prov"></div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
                <div class="form-group"><label>Venta ($)</label><input type="number" id="f-pv"></div>
                <div class="form-group"><label>Costo ($)</label><input type="number" id="f-pc"></div>
            </div>
            <div class="form-group" style="margin-bottom:20px;">
                <label>Estado</label>
                <select id="f-pago"><option value="Pagado">✅ Pagado</option><option value="Pendiente">⏳ Pendiente</option></select>
            </div>
            <button class="btn-save neon-text" id="btn-main" onclick="guardarVenta()">CONFIRMAR VENTA</button>
            <div id="post-venta" style="display:none; margin-top:20px;">
                <a id="btn-wa-link" href="#" target="_blank" style="background:#25d366; color:white; text-decoration:none; padding:18px; border-radius:20px; display:block; text-align:center; font-weight:800;">📲 ENVIAR POR WHATSAPP</a>
                <button class="btn-save" style="background:#f1f5f9; color:#475569; margin-top:12px; border:none;" onclick="nuevaVenta()">VOLVER</button>
            </div>
        </div>
    </div>

    <div id="tab-perfiles-tv" class="tab-content">
        <div class="master-card" style="border-left: 4px solid var(--neon-green);">
            <h3 class="neon-text" style="margin:0 0 20px 0; font-size:18px; font-weight:800;">➕ Ingresar Cuenta (Por Perfiles)</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Plataforma</label>
                    <select id="inv_plataforma_tv">
                        <option>Tele Latino</option><option>Stella TV</option><option>Plex</option>
                        <option>Netflix</option><option>Disney+</option><option>Max</option>
                        <option>Paramount</option><option>Prime Video</option><option>Vix Premium</option>
                        <option>Crunchyroll</option><option>YouTube Individual</option><option>Spotify Individual</option>
                        <option>FlujoTV</option><option>Deezer Individual</option><option>Canva Edu</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cant. de Perfiles</label>
                    <input type="number" id="inv_perfiles_tv" value="1" min="1" max="10" oninput="generarCamposPerfilesTV()">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Correo</label><input type="text" id="inv_correo_tv" placeholder="correo@ejemplo.com"></div>
                <div class="form-group"><label>Contraseña</label><input type="text" id="inv_pass_tv" placeholder="pass123"></div>
            </div>

            <div id="dynamic_profiles_container_tv" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e2e8f0;">
                </div>

            <button class="btn-save neon-text" style="margin-top: 15px;" onclick="agregarCuentaTV()">GUARDAR CUENTA</button>
        </div>

        <div id="lista_inventario_tv">
            </div>
    </div>

    <div id="tab-despacho-tv" class="tab-content">
        <div class="master-card" style="border-left: 4px solid #25D366;">
            <h3 class="neon-text" style="margin:0 0 20px 0; font-size:18px; font-weight:800; color:#25D366 !important;">🚀 Despacho Automático</h3>
            
            <div class="grid-2">
                <div class="form-group">
                    <label style="color: #25D366;">⚡ Autocompletar Cuenta</label>
                    <select id="selector_inventario_tv" onchange="cargarDesdeSelectorTV()" style="border-color: #25D366; background: #f0fdf4; font-weight: bold;">
                        <option value="">-- Cuenta Libre --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="color: var(--accent-color);">👥 Clientes Frecuentes</label>
                    <select id="selector_clientes_tv" onchange="cargarClienteTV()" style="border-color: var(--accent-color); background: #eff6ff; font-weight: bold;">
                        <option value="">-- Nuevo Cliente --</option>
                    </select>
                </div>
            </div>

            <input type="hidden" id="db_account_id_tv">
            <input type="hidden" id="db_profile_index_tv">

            <div class="grid-2">
                <div class="form-group"><label>WhatsApp</label><input type="number" id="cliente_wa_tv" placeholder="Ej: 50582929888"></div>
                <div class="form-group"><label>Nombre Cliente</label><input type="text" id="cliente_nombre_tv" placeholder="Ej: Juan Pérez"></div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Plataforma</label>
                    <select id="plataforma_tv">
                        <option>Tele Latino</option><option>Stella TV</option><option>Plex</option>
                        <option>Netflix</option><option>Disney+</option><option>Max</option>
                        <option>Paramount</option><option>Prime Video</option><option>Vix Premium</option>
                        <option>Crunchyroll</option><option>YouTube Individual</option><option>Spotify Individual</option>
                        <option>FlujoTV</option><option>Deezer Individual</option><option>Canva Edu</option>
                    </select>
                </div>
                <div class="form-group"><label>Vencimiento</label><input type="date" id="vencimiento_tv"></div>
            </div>

            <div class="grid-2">
                <div class="form-group"><label>Usuario</label><input type="text" id="usuario_tv" placeholder="correo@ejemplo.com"></div>
                <div class="form-group"><label>Contraseña</label><input type="text" id="contrasena_tv" placeholder="pass123"></div>
            </div>

            <div class="grid-2">
                <div class="form-group"><label>Perfil Asignado</label><input type="text" id="perfil_tv" placeholder="Ej: Perfil 1"></div>
                <div class="form-group"><label>PIN de Perfil</label><input type="text" id="pin_tv" placeholder="1234"></div>
            </div>

            <button class="btn-save btn-whatsapp" onclick="enviarDespachoTV()">DESPACHAR POR WHATSAPP</button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="verTab('tab-home', this)"><span>🏠</span>Inicio</button>
    <button class="tab-btn" onclick="verTab('tab-inventory', this)"><span>📦</span>Stock</button>
    <button class="tab-btn" onclick="verTab('tab-list', this)"><span>👥</span>Lista</button>
    <button class="tab-btn" onclick="verTab('tab-alerts', this)"><span>🔔</span>Alertas</button>
    <button class="tab-btn" onclick="verTab('tab-add', this)"><span>⚡</span>Venta</button>
    
    <button class="tab-btn" onclick="verTab('tab-perfiles-tv', this)"><span style="color:#fbbf24;">📺</span>Cuentas</button>
    <button class="tab-btn" onclick="verTab('tab-despacho-tv', this)"><span style="color:#25D366;">🚀</span>Despachar</button>
</div>

<script>
    let clientes = JSON.parse(localStorage.getItem('solar_db')) || [];
    let stock = JSON.parse(localStorage.getItem('solar_stock')) || [];
    let inv_tv = JSON.parse(localStorage.getItem('tvnicaplay_db')) || [];
    let cli_tv = JSON.parse(localStorage.getItem('tvnicaplay_clientes')) || [];

    function sincronizarDatosExistentes() {
        let changes = false;
        inv_tv.forEach(cuenta => {
            // Sincronizar cuentas a Stock General
            let existsInStock = stock.find(s => s.id === cuenta.id || (s.correo === cuenta.correo && s.servicio === cuenta.plataforma));
            if (!existsInStock) {
                stock.push({
                    id: cuenta.id,
                    servicio: cuenta.plataforma,
                    plan: 'Premium',
                    correo: cuenta.correo,
                    clave: cuenta.pass,
                    max: cuenta.perfiles.length,
                    is_tv: true
                });
                changes = true;
            } else if (existsInStock && !existsInStock.is_tv) {
                existsInStock.is_tv = true;
                existsInStock.id = cuenta.id; // alinear IDs
                changes = true;
            }
            
            // Sincronizar Perfiles Vendidos a Clientes Generales
            cuenta.perfiles.forEach((p, pIndex) => {
                if (p.vendido) {
                    let existsInCli = clientes.find(c => c.tv_accId === cuenta.id && c.tv_pIndex === pIndex);
                    if (!existsInCli) {
                        clientes.push({
                            id: Date.now() + Math.floor(Math.random()*10000),
                            nombre: p.clienteNombre || 'Sin Nombre',
                            celular: p.cliente || '',
                            servicio: cuenta.plataforma,
                            vence: p.vencimiento,
                            correo: cuenta.correo,
                            clave: cuenta.pass,
                            pin: p.pin || 'Sin PIN',
                            precioVenta: 0,
                            precioCosto: 0,
                            estadoPago: 'Pagado',
                            proveedor: 'Tvnicaplay', // Proveedor por defecto aplicado
                            venceProveedor: p.vencimiento,
                            tv_accId: cuenta.id,
                            tv_pIndex: pIndex
                        });
                        changes = true;
                    }
                }
            });
        });
        if (changes) {
            localStorage.setItem('solar_stock', JSON.stringify(stock));
            localStorage.setItem('solar_db', JSON.stringify(clientes));
        }
    }

    function actualizarDashboard() {
        let inv = 0, gan = 0, w = 0, v = 0;
        const hoy = new Date(); hoy.setHours(0,0,0,0);
        clientes.forEach(c => {
            inv += (c.precioCosto || 0); gan += ((c.precioVenta || 0) - (c.precioCosto || 0));
            if(c.vence) {
                const d = Math.ceil((new Date(c.vence + "T00:00:00").getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24));
                if(d < 0) v++; else if(d <= 1) w++;
            }
        });
        document.getElementById('st-total').innerText = clientes.length;
        document.getElementById('st-warn').innerText = w;
        document.getElementById('st-ven').innerText = v;
        document.getElementById('total-inversion').innerText = `$ ${inv.toFixed(2)}`;
        document.getElementById('total-ganancia').innerText = `$ ${gan.toFixed(2)}`;

                const libres = i.max - ocup.length;
                let dots = '';
                for(let n=0; n<ocup.length; n++) dots += '<span class="dot dot-busy"></span>';
                for(let n=0; n<libres; n++) dots += '<span class="dot dot-free"></span>';
                const cardClass = esDisp ? 'stock-available' : 'stock-full';
                return `<div class="stock-card ${cardClass}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <b class="neon-text">${i.servicio} | ${i.plan}</b><br>
                            <small>${i.correo}</small>
                        </div>
                        <div style="display:flex; gap:8px;">
                            ${!i.is_tv ? `<button onclick="editarStock(${i.id})" style="border:none; background:rgba(255,255,255,0.2); color:white; padding:5px 10px; border-radius:8px;">✎</button>` : ''}
                            ${!i.is_tv ? `<button onclick="borrarStock(${i.id})" style="border:none; background:rgba(255,0,0,0.3); color:white; padding:5px 10px; border-radius:8px;">✕</button>` : ''}
                        </div>

                </div>`;
            }).join('');
        };
        const disp = stock.filter(i => (i.max - clientes.filter(c => c.correo === i.correo).length) > 0);
        const full = stock.filter(i => (i.max - clientes.filter(c => c.correo === i.correo).length) <= 0);
        container.innerHTML = (disp.length ? `<div class="section-header neon-text" style="margin:20px 0 10px 10px;">DISPONIBLES</div>` + buildCards(disp, true) : '') +

            c.servicio.toLowerCase().includes(query) ||

        );
        
        const build = (lista) => {
            return lista.map(c => {
                const dCli = c.vence ? Math.ceil((new Date(c.vence + "T00:00:00").getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24)) : 0;
                const txtD = dCli < 0 ? `Vencido (${Math.abs(dCli)}d)` : (dCli == 0 ? 'Hoy' : `${dCli} días`);
                let txtProv = c.venceProveedor ? Math.ceil((new Date(c.venceProveedor + "T00:00:00").getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24)) + " días" : "N/A";

        const aArr = filtrados.filter(c => { if(!c.vence) return false; const d = Math.ceil((new Date(c.vence + "T00:00:00").getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24)); return d >= 0 && d <= 1; });
        const actArr = filtrados.filter(c => c.vence && Math.ceil((new Date(c.vence + "T00:00:00").getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24)) > 1);
        document.getElementById('sec-activos').innerHTML = build(actArr);

    function abrirConfigNube() {
        const dbUrl = prompt("Pega la URL de tu Google Firebase Realtime Database:\nEjemplo: https://tu-proyecto.firebaseio.com/", localStorage.getItem('cloud_firebase_url') || "");
        
        if (dbUrl !== null && dbUrl.trim() !== "") {
            let finalUrl = dbUrl.trim();
            if (!finalUrl.endsWith('/')) finalUrl += '/';
            localStorage.setItem('cloud_firebase_url', finalUrl);
            alert("✅ URL de Google Firebase guardada correctamente en este dispositivo.");
        }
    }

    async function guardarEnNube() {
        const dbUrl = localStorage.getItem('cloud_firebase_url');
        if(!dbUrl) return alert("❌ Primero configura la URL dando clic en '⚙️ Configurar API Nube'");

        const endpoint = dbUrl + "streambase.json";
        const payload = { db: clientes, stock: stock, tv_db: inv_tv, tv_cli: cli_tv, ultima_vez: new Date().toLocaleString() };
        
        try {
            document.body.style.cursor = 'wait';
            const response = await fetch(endpoint, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if(response.ok) {
                alert("✅ Sincronización exitosa. Tus datos están seguros en Google Firebase.");
            } else {
                alert("❌ Falló la conexión con Firebase. Revisa tu URL.");
            }
        } catch(e) {
            alert("❌ Error de red: " + e.message);
        } finally {
            document.body.style.cursor = 'default';
        }
    }

    async function cargarDeNube() {
        const dbUrl = localStorage.getItem('cloud_firebase_url');
        if(!dbUrl) return alert("❌ Primero configura la URL dando clic en '⚙️ Configurar API Nube'");

        if(!confirm("⚠️ ATENCIÓN: Esto descargará los datos de Google Firebase y REEMPLAZARÁ la información de este dispositivo. ¿Continuar?")) return;

        const endpoint = dbUrl + "streambase.json";

        try {
            document.body.style.cursor = 'wait';
            const response = await fetch(endpoint);
            
            if(response.ok) {
                const data = await response.json();
                if(!data) return alert("❌ La base de datos está vacía. Primero debes subir datos.");

                clientes = data.db || []; 
                stock = data.stock || []; 
                inv_tv = data.tv_db || []; 
                cli_tv = data.tv_cli || []; 
                
                localStorage.setItem('solar_db', JSON.stringify(clientes)); 
                localStorage.setItem('solar_stock', JSON.stringify(stock)); 
                localStorage.setItem('tvnicaplay_db', JSON.stringify(inv_tv)); 
                localStorage.setItem('tvnicaplay_clientes', JSON.stringify(cli_tv)); 
                
                alert(`✅ Datos restaurados con éxito.\nÚltimo respaldo: ${data.ultima_vez || 'Desconocido'}`);
                location.reload();
            } else {
                alert("❌ Error al acceder a Firebase. Verifica tu URL o los permisos de tu base.");
            }
        } catch(e) {
            alert("❌ Error de conexión: " + e.message);
        } finally {
            document.body.style.cursor = 'default';
        }
    }

        let container = document.getElementById('dynamic_profiles_container_tv');
        let count = parseInt(document.getElementById('inv_perfiles_tv').value) || 0;
        container.innerHTML = '';
        if (count <= 0) return;

        let html = '<label style="font-size: 11px; font-weight: 800; color: var(--solar-dark);">Nombres y PIN de Perfiles (Opcional)</label>';
        for (let i = 1; i <= count; i++) {
            let defaultName = count === 1 ? "Individual" : "Perfil " + i;
            html += `
            <div class="grid-2">
                <div><input type="text" id="inv_prof_name_tv_${i}" value="${defaultName}" style="padding: 8px; font-size: 11px;"></div>
                <div><input type="text" id="inv_prof_pin_tv_${i}" placeholder="PIN" style="padding: 8px; font-size: 11px;"></div>
            </div>`;
        }
        container.innerHTML = html;
    }

    function agregarCuentaTV() {
        let plat = document.getElementById('inv_plataforma_tv').value;
        let perfilesCount = parseInt(document.getElementById('inv_perfiles_tv').value);
        let correo = document.getElementById('inv_correo_tv').value;
        let pass = document.getElementById('inv_pass_tv').value;

        if(!correo || !pass) return alert("Por favor, ingresa el correo y la contraseña.");

        let nuevaCuenta = { id: Date.now(), plataforma: plat, correo: correo, pass: pass, perfiles: [] };

        for(let i = 1; i <= perfilesCount; i++) {
            let inputName = document.getElementById('inv_prof_name_tv_' + i);
            let inputPin = document.getElementById('inv_prof_pin_tv_' + i);
            let pName = inputName ? inputName.value.trim() : (perfilesCount === 1 ? "Individual" : "Perfil " + i);
            
            nuevaCuenta.perfiles.push({
                nombre: pName !== "" ? pName : (perfilesCount === 1 ? "Individual" : "Perfil " + i),
                pin: inputPin ? inputPin.value.trim() : "",
                vendido: false, cliente: "", clienteNombre: "", vencimiento: ""
            });
        }

        inv_tv.push(nuevaCuenta);
        guardarDB_TV();
        
        // SYNC STOCK:
        stock.push({
            id: nuevaCuenta.id,
            servicio: plat,
            plan: 'Premium',
            correo: correo,
            clave: pass,
            max: perfilesCount,
            is_tv: true
        });
        localStorage.setItem('solar_stock', JSON.stringify(stock));

        document.getElementById('inv_correo_tv').value = "";
        document.getElementById('inv_pass_tv').value = "";
        generarCamposPerfilesTV(); 
        renderInventarioTV();
        renderStock();
    }

    function editarCuentaTV(accountId) {
        let cuenta = inv_tv.find(c => c.id === accountId);
        if(cuenta) {
            let nuevoCorreo = prompt("Editar Correo / Usuario de " + cuenta.plataforma + ":", cuenta.correo);
            if(nuevoCorreo !== null && nuevoCorreo.trim() !== "") {
                let nuevaPass = prompt("Editar Contraseña:", cuenta.pass);
                if(nuevaPass !== null && nuevaPass.trim() !== "") {
                    cuenta.correo = nuevoCorreo.trim(); cuenta.pass = nuevaPass.trim();
                    
                    // Sincronizar en DB General
                    let stockItem = stock.find(s => s.id === accountId);
                    if(stockItem) { stockItem.correo = cuenta.correo; stockItem.clave = cuenta.pass; }
                    clientes.forEach(c => {
                        if(c.tv_accId === accountId) { c.correo = cuenta.correo; c.clave = cuenta.pass; }
                    });
                    
                    localStorage.setItem('solar_stock', JSON.stringify(stock));
                    localStorage.setItem('solar_db', JSON.stringify(clientes));
                    guardarDB_TV(); renderInventarioTV(); renderStock();
                }
            }
        }
    }

    function eliminarCuentaTV(accountId) {
        let cuenta = inv_tv.find(c => c.id === accountId);
        if(cuenta && confirm("⚠️ ¿Seguro de ELIMINAR la cuenta " + cuenta.correo + "?\nEsta acción no se puede deshacer.")) {
            inv_tv = inv_tv.filter(c => c.id !== accountId);
            // Limpiar en otras DB
            stock = stock.filter(s => s.id !== accountId);
            clientes = clientes.filter(c => c.tv_accId !== accountId);
            
            localStorage.setItem('solar_stock', JSON.stringify(stock));
            localStorage.setItem('solar_db', JSON.stringify(clientes));
            
            guardarDB_TV(); renderInventarioTV(); renderStock(); renderizarLista(); actualizarDashboard();
        }
    }

    function abrirModalPerfilTV(accountId, pIndex) {
        let cuenta = inv_tv.find(c => c.id === accountId);
        if(!cuenta) return;
        let perfil = cuenta.perfiles[pIndex];
        document.getElementById('modal_acc_id_tv').value = accountId;
        document.getElementById('modal_p_index_tv').value = pIndex;
        document.getElementById('modal_plat_name_tv').value = cuenta.plataforma;
        document.getElementById('modal_usr_tv').value = cuenta.correo;
        document.getElementById('modal_pwd_tv').value = cuenta.pass;
        document.getElementById('m_nombre_tv').value = perfil.nombre;
        document.getElementById('m_pin_tv').value = perfil.pin || "";
        document.getElementById('m_wa_tv').value = perfil.cliente || "";
        document.getElementById('m_cliente_tv').value = perfil.clienteNombre || "";
        document.getElementById('m_vence_tv').value = perfil.vencimiento || "";
        document.getElementById('modal-perfil-tv').style.display = 'flex';
    }

    function cerrarModalTV() { document.getElementById('modal-perfil-tv').style.display = 'none'; }

    function guardarEdicionPerfilTV() {
        let accId = parseInt(document.getElementById('modal_acc_id_tv').value);
        let pIndex = parseInt(document.getElementById('modal_p_index_tv').value);
        let cuenta = inv_tv.find(c => c.id === accId);
        
        if(cuenta) {
            cuenta.perfiles[pIndex].nombre = document.getElementById('m_nombre_tv').value.trim();
            cuenta.perfiles[pIndex].pin = document.getElementById('m_pin_tv').value.trim();
            cuenta.perfiles[pIndex].cliente = document.getElementById('m_wa_tv').value.trim();
            cuenta.perfiles[pIndex].clienteNombre = document.getElementById('m_cliente_tv').value.trim();
            cuenta.perfiles[pIndex].vencimiento = document.getElementById('m_vence_tv').value;
            
            // Sync to Clientes
            let cli = clientes.find(c => c.tv_accId === accId && c.tv_pIndex === pIndex);
            if(cli) {
                cli.nombre = cuenta.perfiles[pIndex].clienteNombre;
                cli.celular = cuenta.perfiles[pIndex].cliente;
                cli.vence = cuenta.perfiles[pIndex].vencimiento;
                cli.pin = cuenta.perfiles[pIndex].pin;
                localStorage.setItem('solar_db', JSON.stringify(clientes));
            }
            
            guardarDB_TV(); cerrarModalTV(); renderInventarioTV(); renderizarLista(); actualizarDashboard();
        }
    }

    function renovarPerfilTV() {
        let accId = parseInt(document.getElementById('modal_acc_id_tv').value);
        let pIndex = parseInt(document.getElementById('modal_p_index_tv').value);
        let cuenta = inv_tv.find(c => c.id === accId);
        if(!cuenta) return;

        let plat = document.getElementById('modal_plat_name_tv').value;
        let usr = document.getElementById('modal_usr_tv').value;
        let pwd = document.getElementById('modal_pwd_tv').value;
        let prf = document.getElementById('m_nombre_tv').value.trim();
        let pin = document.getElementById('m_pin_tv').value.trim();
        let wa = document.getElementById('m_wa_tv').value.trim();
        let nombreC = document.getElementById('m_cliente_tv').value.trim();
        let vncStr = document.getElementById('m_vence_tv').value;

        if(!wa) return alert("El perfil necesita un número de WhatsApp para avisar.");

        let fechaBase = new Date(vncStr + 'T12:00:00');
        if(isNaN(fechaBase.getTime()) || fechaBase < new Date()) fechaBase = new Date();
        fechaBase.setMonth(fechaBase.getMonth() + 1);
        let nuevoVencimiento = fechaBase.toISOString().split('T')[0];

        cuenta.perfiles[pIndex].nombre = prf;
        cuenta.perfiles[pIndex].pin = pin;
        cuenta.perfiles[pIndex].cliente = wa;
        cuenta.perfiles[pIndex].clienteNombre = nombreC;
        cuenta.perfiles[pIndex].vencimiento = nuevoVencimiento;
        guardarDB_TV();
        
        // Sync Clientes
        let cli = clientes.find(c => c.tv_accId === accId && c.tv_pIndex === pIndex);
        if(cli) {
            cli.vence = nuevoVencimiento;
            cli.nombre = nombreC;
            cli.celular = wa;
            cli.pin = pin;
            localStorage.setItem('solar_db', JSON.stringify(clientes));
        }

        let saludo = nombreC ? `Hola *${nombreC}*` : "Hola";
        let texto = `🚀 *¡RENOVACIÓN EXITOSA!* 🚀\n\n`;
        texto += `${saludo}, tu servicio de *${plat}* ha sido renovado.\n\n`;
        texto += `📺 *Plataforma:* ${plat}\n`;
        texto += `👤 *Usuario:* ${usr}\n`;
        texto += `🔑 *Contraseña:* ${pwd}\n`;
        if(prf !== "Individual" && prf !== "") { texto += `🖼️ *Perfil:* ${prf}\n`; }
        if(pin && pin !== "Sin PIN") { texto += `🔒 *PIN:* ${pin}\n`; }
        texto += `⏳ *Nuevo Vencimiento:* ${nuevoVencimiento}\n\n`;
        texto += `¡Gracias por tu preferencia! Cualquier duda estamos a la orden.\n`;
        texto += `👉 https://wa.me/50582929888`;

        cerrarModalTV(); renderInventarioTV(); renderizarLista(); actualizarDashboard();
        window.open("https://wa.me/" + wa + "?text=" + encodeURIComponent(texto), '_blank');
    }

    function modalLiberarPerfilTV() {
        if(confirm("¿Seguro que deseas LIBERAR este perfil?\nPasará a estar disponible en el inventario.")) {
            let accId = parseInt(document.getElementById('modal_acc_id_tv').value);
            let pIndex = parseInt(document.getElementById('modal_p_index_tv').value);
            let cuenta = inv_tv.find(c => c.id === accId);
            if(cuenta) {
                cuenta.perfiles[pIndex].vendido = false;
                cuenta.perfiles[pIndex].cliente = "";
                cuenta.perfiles[pIndex].clienteNombre = "";
                cuenta.perfiles[pIndex].vencimiento = "";
                
                // Remover de Clientes General
                clientes = clientes.filter(c => !(c.tv_accId === accId && c.tv_pIndex === pIndex));
                localStorage.setItem('solar_db', JSON.stringify(clientes));
                
                guardarDB_TV(); cerrarModalTV(); renderInventarioTV(); renderizarLista(); actualizarDashboard();
            }
        }
    }

    function cargarDesdeSelectorTV() {
        let val = document.getElementById('selector_inventario_tv').value;
        if(!val) {
            document.getElementById('db_account_id_tv').value = ""; document.getElementById('db_profile_index_tv').value = "";
            document.getElementById('perfil_tv').value = ""; document.getElementById('pin_tv').value = "";
            return;
        }
        let partes = val.split("|");
        let accountId = parseInt(partes[0]); let pIndex = parseInt(partes[1]);
        let cuenta = inv_tv.find(c => c.id === accountId);
        if(cuenta) {
            document.getElementById('plataforma_tv').value = cuenta.plataforma;
            document.getElementById('usuario_tv').value = cuenta.correo;
            document.getElementById('contrasena_tv').value = cuenta.pass;
            document.getElementById('perfil_tv').value = cuenta.perfiles[pIndex].nombre;
            document.getElementById('pin_tv').value = cuenta.perfiles[pIndex].pin || "";
            document.getElementById('db_account_id_tv').value = accountId;
            document.getElementById('db_profile_index_tv').value = pIndex;
        }
    }

    function cargarClienteTV() {
        let val = document.getElementById('selector_clientes_tv').value;
        if(val) {
            let partes = val.split("|");
            document.getElementById('cliente_wa_tv').value = partes[0];
            document.getElementById('cliente_nombre_tv').value = partes[1];
        } else {
            document.getElementById('cliente_wa_tv').value = "";
            document.getElementById('cliente_nombre_tv').value = "";
        }
    }

    function prepararDespachoTV(accountId, pIndex) {
        let cuenta = inv_tv.find(c => c.id === accountId);
        if(!cuenta || cuenta.perfiles[pIndex].vendido) return;

        document.getElementById('plataforma_tv').value = cuenta.plataforma;
        document.getElementById('usuario_tv').value = cuenta.correo;
        document.getElementById('contrasena_tv').value = cuenta.pass;
        document.getElementById('perfil_tv').value = cuenta.perfiles[pIndex].nombre;
        document.getElementById('pin_tv').value = cuenta.perfiles[pIndex].pin || "";
        
        document.getElementById('db_account_id_tv').value = accountId;
        document.getElementById('db_profile_index_tv').value = pIndex;
        document.getElementById('selector_inventario_tv').value = accountId + "|" + pIndex;

        verTab('tab-despacho-tv', document.querySelectorAll('.tab-btn')[6]);
    }

    function enviarDespachoTV() {
        let wa = document.getElementById('cliente_wa_tv').value;
        let nombre = document.getElementById('cliente_nombre_tv').value.trim();
        let plat = document.getElementById('plataforma_tv').value;
        let usr = document.getElementById('usuario_tv').value;
        let pwd = document.getElementById('contrasena_tv').value;
        let prf = document.getElementById('perfil_tv').value;
        let pin = document.getElementById('pin_tv').value || "Sin PIN";
        let vnc = document.getElementById('vencimiento_tv').value;

        if(!wa || !plat) return alert("Faltan datos (WhatsApp o Plataforma).");

        let indexCliente = cli_tv.findIndex(c => c.wa === wa);
        if(indexCliente >= 0) {
            if(nombre) cli_tv[indexCliente].nombre = nombre;
        } else {
            if(wa) cli_tv.push({wa: wa, nombre: nombre || "Sin Nombre"});
        }
        localStorage.setItem('tvnicaplay_clientes', JSON.stringify(cli_tv));

        let accId = document.getElementById('db_account_id_tv').value;
        let pIndex = document.getElementById('db_profile_index_tv').value;
        
        if(accId && pIndex !== "") {
            let cuenta = inv_tv.find(c => c.id == parseInt(accId));
            if(cuenta) {
                cuenta.perfiles[pIndex].vendido = true;
                cuenta.perfiles[pIndex].cliente = wa;
                cuenta.perfiles[pIndex].clienteNombre = nombre;
                cuenta.perfiles[pIndex].vencimiento = vnc;
                guardarDB_TV();
                
                // SYNC A CLIENTES GENERALES
                clientes.push({
                    id: Date.now() + Math.floor(Math.random()*1000),
                    nombre: nombre || "Sin Nombre",
                    celular: wa,
                    servicio: plat,
                    vence: vnc,
                    correo: usr,
                    clave: pwd,
                    pin: pin,
                    precioVenta: 0,
                    precioCosto: 0,
                    estadoPago: 'Pagado',
                    proveedor: 'Tvnicaplay',
                    venceProveedor: vnc,
                    tv_accId: parseInt(accId),
                    tv_pIndex: parseInt(pIndex)
                });
                localStorage.setItem('solar_db', JSON.stringify(clientes));
            }
        }

        let saludo = nombre ? `Hola *${nombre}*, gracias por tu confianza.` : "Hola, gracias por tu confianza.";
        let texto = `🚀 *¡TU PEDIDO HA SIDO DESPACHADO!* 🚀\n\n`;
        texto += `${saludo} Tu cuenta ya está activa:\n\n`;
        texto += `📺 *Plataforma:* ${plat}\n`;
        texto += `👤 *Usuario:* ${usr}\n`;
        texto += `🔑 *Contraseña:* ${pwd}\n`;
        if(prf !== "Individual" && prf !== "") { texto += `🖼️ *Perfil:* ${prf}\n`; }
        if(pin !== "Sin PIN") { texto += `🔒 *PIN:* ${pin}\n`; }
        texto += `⏳ *Vence:* ${vnc}\n\n`;
        
        texto += `⚠️ *IMPORTANTE:* Sigue las reglas de la cuenta para evitar caídas.\n\n`;
        texto += `¿Más cuentas? Escríbenos: https://wa.me/50582929888`;

        document.getElementById('cliente_wa_tv').value = ""; document.getElementById('cliente_nombre_tv').value = "";
        document.getElementById('pin_tv').value = ""; document.getElementById('db_account_id_tv').value = "";
        document.getElementById('db_profile_index_tv').value = ""; document.getElementById('selector_clientes_tv').value = "";
        
        window.open("https://wa.me/" + wa + "?text=" + encodeURIComponent(texto), '_blank');
        renderInventarioTV(); 
        renderizarLista();
        actualizarDashboard();
    }

    function getDiasRestantesTV(fechaStr) {
        if(!fechaStr) return 999; 
        let partes = fechaStr.split('-');
        let venc = new Date(partes[0], partes[1] - 1, partes[2]);
        let hoy = new Date(); hoy.setHours(0,0,0,0);
        return Math.ceil((venc.getTime() - hoy.getTime()) / (1000 * 3600 * 24));
    }

    function renderInventarioTV() {
        let container = document.getElementById('lista_inventario_tv');
        let selectorCuentas = document.getElementById('selector_inventario_tv');
        let selectorClientes = document.getElementById('selector_clientes_tv');
        
        container.innerHTML = "";
        selectorCuentas.innerHTML = '<option value="">-- Cuenta Libre --</option>';
        selectorClientes.innerHTML = '<option value="">-- Nuevo Cliente --</option>';

        cli_tv.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.wa + "|" + c.nombre; opt.text = c.nombre + " (" + c.wa + ")";
            selectorClientes.appendChild(opt);
        });

        plat_tv.forEach(platNombre => {
            let cuentasPlat = inv_tv.filter(c => c.plataforma === platNombre);
            if(cuentasPlat.length === 0) return;

            let stockTotalLibre = 0;
            cuentasPlat.forEach(c => { stockTotalLibre += c.perfiles.filter(p => !p.vendido).length; });

            let htmlPlat = `
                <div class="service-tile" style="padding: 15px; border-left: 3px solid var(--neon-green);">
                    <div class="platform-title" style="font-weight: 800; margin-bottom: 10px;">
                        ${platNombre} <span class="badge bg-activo" style="font-size:11px;">${stockTotalLibre} Libres</span>
                    </div>`;

            cuentasPlat.forEach(cuenta => {
                htmlPlat += `
                    <div class="account-card" style="border: 1px dashed var(--border); padding: 10px; border-radius: 12px; margin-bottom: 10px;">
                        <div class="account-header">
                            <span>📧 ${cuenta.correo} <span style="color:#9ca3af; font-size:11px; font-weight:normal;">(Pass: ${cuenta.pass})</span></span>
                            <div class="account-actions">
                                <button onclick="editarCuentaTV(${cuenta.id})" title="Editar Correo/Contraseña">✏️</button>
                                <button onclick="eliminarCuentaTV(${cuenta.id})" title="Eliminar Cuenta">🗑️</button>
                            </div>
                        </div>
                        <div class="profiles-grid">`;
                
                cuenta.perfiles.forEach((perfil, index) => {
                    let label = perfil.nombre;
                    if(label === 'Individual') label = 'IND';
                    else if(label.startsWith('Perfil ')) label = 'P' + label.replace('Perfil ', '');

                    if(!perfil.vendido) {
                        htmlPlat += `
                            <div class="profile-badge profile-free" onclick="prepararDespachoTV(${cuenta.id}, ${index})" title="Nombre: ${perfil.nombre}\nPIN: ${perfil.pin || 'Sin PIN'}\nClic para Despachar">
                                <span style="font-size:14px;">${label}</span>
                                <span style="font-size:10px; font-weight:normal; margin-top:2px;">Libre</span>
                            </div>`;
                        
                        let opt = document.createElement('option');
                        opt.value = cuenta.id + "|" + index;
                        opt.text = `🟢 ${platNombre} - ${cuenta.correo} (${perfil.nombre})`;
                        selectorCuentas.appendChild(opt);
                    } else {
                        let difDias = getDiasRestantesTV(perfil.vencimiento);
                        let bgStatus = "var(--sold-normal)"; let txtStatus = "⏳ " + difDias + " d";
                        if (difDias < 0) { bgStatus = "var(--sold-expired)"; txtStatus = "❌ Vencido"; } 
                        else if (difDias === 0) { bgStatus = "var(--sold-warning)"; txtStatus = "⚠️ HOY"; } 
                        else if (difDias === 1) { bgStatus = "var(--sold-warning)"; txtStatus = "⚠️ 1 Día"; }

                        let nombreCorto = perfil.clienteNombre ? perfil.clienteNombre.substring(0, 8) : (perfil.cliente || "Vendido").substring(0, 8);
                        
                        htmlPlat += `
                            <div class="profile-badge" style="background-color: ${bgStatus}; color: white;" onclick="abrirModalPerfilTV(${cuenta.id}, ${index})" title="Vendido a: ${perfil.clienteNombre || 'Sin nombre'} (${perfil.cliente})\nVence: ${perfil.vencimiento}\nClic para Gestionar/Renovar">
                                <span>${label}</span>
                                <span style="font-size:10px; font-weight:normal; margin-top:3px; color: #f1f5f9;">👤 ${nombreCorto}</span>
                                <span style="font-size:11px; font-weight:normal;">${txtStatus}</span>
                            </div>`;
                    }
                });
                htmlPlat += `</div></div>`;
            });
            htmlPlat += `</div>`;
            container.innerHTML += htmlPlat;
        });
    }

    function guardarDB_TV() { localStorage.setItem('tvnicaplay_db', JSON.stringify(inv_tv)); }

    /* Inicializadores */
    window.onload = () => { 
        sincronizarDatosExistentes(); 
        actualizarDashboard(); 
        renderStock(); 
        generarCamposPerfilesTV();
        renderInventarioTV();
    };
</script>
</body>
</html>
