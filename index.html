<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBase v3.6 Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #0f172a; --surface: #1e293b; --primary: #38bdf8; 
            --accent: #fbbf24; --text-high: #f8fafc; --text-med: #94a3b8;
            --success: #22c55e; --danger: #ef4444; --radius: 20px;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-app); color: var(--text-high); margin: 0; padding-bottom: 120px; }
        
        .navbar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 20px; text-align: center; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 1000; }
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .tab-content { display: none; } .active-tab { display: block; }

        .master-card, .service-tile, .stat-item { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius); padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); margin-bottom: 20px; }
        
        input, select { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .btn-save { background: var(--primary); color: var(--bg-app); border: none; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.3s; }
        
        .tab-bar { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--surface); border-radius: 30px; padding: 10px; display: flex; justify-content: space-around; z-index: 2000; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: var(--text-med); font-size: 18px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-btn.active { color: var(--primary); font-weight: 800; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .stat-item { text-align: center; padding: 15px 5px; }
        .stat-item b { display: block; font-size: 20px; color: var(--primary); }

        .profile-badge { padding: 8px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; background: var(--primary); color: var(--bg-app); }
        .profiles-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:3000; }
        .modal-content { background: var(--surface); padding: 25px; border-radius: var(--radius); width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<div class="navbar">STREAMBASE <span style="color:var(--primary)">PRO v3.6</span></div>

<div class="container">
    <div id="tab-home" class="tab-content active-tab">
        <div class="stats-grid">
            <div class="stat-item"><small>Clientes</small><b id="st-total">0</b></div>
            <div class="stat-item"><small>Alerta</small><b id="st-warn" style="color:var(--accent)">0</b></div>
            <div class="stat-item"><small>Vencidos</small><b id="st-ven" style="color:var(--danger)">0</b></div>
        </div>
    </div>
    </div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="verTab('tab-home', this)">🏠</button>
    <button class="tab-btn" onclick="verTab('tab-inventory', this)">📦</button>
    <button class="tab-btn" onclick="verTab('tab-list', this)">👥</button>
    <button class="tab-btn" onclick="verTab('tab-perfiles-tv', this)">📺</button>
    <button class="tab-btn" onclick="verTab('tab-add', this)">⚡</button>
</div>

<script>
    /* TODO: Aquí va toda tu lógica JavaScript original (no cambies los nombres de funciones) */
    /* El sistema de navegación 'verTab' y el almacenamiento en localStorage se mantienen intactos */
</script>
</body>
</html>
