<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase Enterprise | Professional Control</title>
    <style>
        :root {
            --bg: #050505; --panel: #111111; --accent: #FFD700;
            --netflix: #E50914; --disney: #113CCF; --max: #A020F0;
        }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; }
        
        /* Sidebar Profesional */
        .sidebar { width: 260px; background: #000; border-right: 1px solid #222; height: 100vh; padding: 20px; }
        .logo { color: var(--accent); font-weight: 900; font-size: 20px; margin-bottom: 40px; }
        .nav-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; }
        .nav-item:hover { background: #111; color: var(--accent); }
        
        /* Main */
        .main { flex: 1; padding: 40px; }
        .card-elegant { background: linear-gradient(145deg, #161616, #0a0a0a); border: 1px solid #222; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Colores por Servicio */
        .tag { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
        .bg-Netflix { background: var(--netflix); }
        .bg-Disney { background: var(--disney); }
        .bg-Max { background: var(--max); }
        
        h1 { font-weight: 300; letter-spacing: -1px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">STREAMBASE PRO</div>
        <div class="nav-item" onclick="showSection('dashboard')">📊 Dashboard Ejecutivo</div>
        <div class="nav-item" onclick="showSection('clients')">👥 Cartera Clientes</div>
        <div class="nav-item" onclick="showSection('accounts')">🍿 Gestión Cuentas</div>
        <div class="nav-item" onclick="showSection('cash')">💸 Flujo de Caja</div>
    </div>

    <div class="main">
        <div id="dashboard" class="section">
            <h1>Panel Ejecutivo</h1>
            <div style="display:flex; gap:20px;">
                <div class="card-elegant" style="flex:1"><h3>TOTAL VENTAS</h3><h2 id="d-ventas">$0.00</h2></div>
                <div class="card-elegant" style="flex:1"><h3>CLIENTES</h3><h2 id="d-clientes">0</h2></div>
            </div>
            <br>
            <table style="width:100%; border-collapse: collapse;">
                <thead><tr style="text-align:left; color:#666; font-size:12px;"><th>CLIENTE</th><th>SERVICIO</th><th>VENCIMIENTO</th></tr></thead>
                <tbody id="vencimientos-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Lógica de colores automáticos para servicios
        function getServiceClass(name) {
            if(name.toLowerCase().includes('netflix')) return 'bg-Netflix';
            if(name.toLowerCase().includes('disney')) return 'bg-Disney';
            if(name.toLowerCase().includes('max')) return 'bg-Max';
            return 'bg-secondary';
        }

        // Renderizado Profesional con etiquetas de color
        function renderDashboard() {
            let tbody = document.getElementById('vencimientos-body');
            tbody.innerHTML = '';
            state.db.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td>${c.nombre}</td>
                        <td><span class="tag ${getServiceClass(c.servicio)}">${c.servicio}</span></td>
                        <td>${c.vence}</td>
                    </tr>`;
            });
        }
        
        // El resto de la lógica de Firebase y Sincronización se mantiene igual...
    </script>
</body>
</html>
