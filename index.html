<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StreamBase Enterprise Control</title>
    <style>
        :root { --bg: #050505; --panel: #111111; --accent: #FFD700; --text: #E6EDF3; --emerald: #10B981; --red: #EF4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 260px; background: #000; height: 100vh; padding: 20px; border-right: 1px solid #222; }
        .nav-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: #aaa; font-weight: bold; }
        .nav-item:hover { background: #111; color: var(--accent); }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .section { display: none; }
        .card { background: var(--panel); border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #666; font-size: 12px; padding: 10px; border-bottom: 1px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #222; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--accent)">STREAMBASE PRO</h2>
        <div class="nav-item" onclick="showSection('dashboard')">📊 Resumen General</div>
        <div class="nav-item" onclick="showSection('clients')">👥 Gestión Clientes</div>
        <div class="nav-item" onclick="showSection('accounts')">🍿 Control Cuentas</div>
        <div class="nav-item" onclick="showSection('cash')">💸 Flujo de Caja</div>
        <div class="nav-item" onclick="showSection('config')">⚙️ Ajustes Nube</div>
    </div>
    <div class="main">
        <div id="dashboard" class="section" style="display:block;">
            <h1>Panel Ejecutivo</h1>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:20px;">
                <div class="card"><h3>CLIENTES</h3><h2 id="d-c">0</h2></div>
                <div class="card"><h3>CUENTAS</h3><h2 id="d-a">0</h2></div>
                <div class="card"><h3>INGRESOS</h3><h2 id="d-i">$0.00</h2></div>
                <div class="card"><h3>EGRESOS</h3><h2 id="d-o">$0.00</h2></div>
            </div>
        </div>
        <div id="clients" class="section">
            <h1>Gestión Clientes</h1>
            <button onclick="alert('Funcionalidad de Agregar Integrada')" style="background:var(--emerald); color:#000">➕ Nuevo Cliente</button>
            <table id="t-clients"><thead><tr><th>Nombre</th><th>Servicio</th><th>Vencimiento</th></tr></thead><tbody id="b-clients"></tbody></table>
        </div>
        <div id="accounts" class="section"><h1>Control Cuentas TV</h1><div id="b-accounts"></div></div>
        <div id="cash" class="section"><h1>Flujo de Caja</h1></div>
        <div id="config" class="section">
            <h1>Ajustes Nube</h1>
            <input type="text" id="fb-url" placeholder="https://tu-proyecto.firebaseio.com/" style="width:80%; padding:10px;">
            <button onclick="saveAndSync()">💾 Guardar y Conectar</button>
        </div>
    </div>

    <script>
        let state = { db: [], tv_db: [], cash: [], url: localStorage.getItem('streambase_url') || '' };
        
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        async function saveAndSync() {
            state.url = document.getElementById('fb-url').value.trim();
            if(!state.url.endsWith('/')) state.url += '/';
            localStorage.setItem('streambase_url', state.url);
            await sync();
        }

        async function sync() {
            try {
                let res = await fetch(state.url + 'streambase.json');
                let data = await res.json();
                state.db = data.db || [];
                state.tv_db = data.tv_db || [];
                state.cash = data.cash_flow_transactions || [];
                
                // Renderizar los datos tal cual la lógica original
                document.getElementById('d-c').innerText = state.db.length;
                document.getElementById('d-a').innerText = state.tv_db.length;
                let b = document.getElementById('b-clients');
                b.innerHTML = '';
                state.db.forEach(c => {
                    b.innerHTML += `<tr><td>${c.nombre}</td><td>${c.servicio}</td><td>${c.vence}</td></tr>`;
                });
            } catch(e) { alert("Error al cargar datos. Verifica la URL y las Reglas de Firebase."); }
        }
        
        if(state.url) { document.getElementById('fb-url').value = state.url; sync(); }
    </script>
</body>
</html>
